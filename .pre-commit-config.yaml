# Guard-rails that do not depend on Claude Code (Codex, editors, CI all hit these).
#   uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: lint-scenes
        name: AGENTS.md lint (ManimGL-isms, stray colours, inline equations)
        entry: uv run python tools/lint_scenes.py
        language: system
        files: ^(src|gallery|topics)/.*\.py$
        pass_filenames: true
      - id: fast-tests
        name: fast tests (unit + docs consistency)
        entry: uv run pytest -q -m "not slow"
        language: system
        pass_filenames: false
        always_run: true
