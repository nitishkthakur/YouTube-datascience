# Global Manim render defaults. Read from the repo root (tools/render.py runs there).
# Colours, fonts and the XeLaTeX template are NOT set here — an INI file cannot import
# src/dsanim/palette.py — they are applied in code when a scene imports dsanim.scene.
# -ql / -qm / -qh / -qk override resolution and frame rate.
[CLI]
frame_rate = 60
pixel_height = 1080
pixel_width = 1920
media_dir = ./media
