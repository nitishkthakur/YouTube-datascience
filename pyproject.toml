[project]
name = "dsanim"
version = "0.1.0"
description = "Reusable Manim components and tooling for an animated data-science channel"
readme = "AGENTS.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Nitish Kumar Thakur" }]
dependencies = [
    "manim>=0.20,<0.22",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "pillow>=10.0",
    "soundfile>=0.12",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Placeholder narration (never shipped). Kokoro-82M, Apache-2.0.
tts = ["kokoro>=0.9.4", "transformers>=4.40", "torch>=2.4"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsanim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "smoke: fast end-to-end checks that the toolchain works at all",
    "regression: pins the behaviour of a major feature against a golden/known result",
    "slow: renders video or runs TTS (seconds to a minute each)",
]
filterwarnings = ["ignore::SyntaxWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
